name: PR Check Linux

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.41.4' }}

jobs:
  check_linux_analyze:
    name: Analyze Linux
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_linux
        run: flutter analyze

  check_linux_test:
    name: Test Linux
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Clean example
        working-directory: zstandard_linux/example
        run: flutter clean

      - name: Get example dependencies
        working-directory: zstandard_linux/example
        run: flutter pub get

      - name: Run integration tests
        working-directory: zstandard_linux/example
        run: flutter test integration_test/ -d linux

  check_linux_test_from_pub_cache:
    name: Test Linux (from pub cache)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Remove zstandard_native to force resolution from pub cache
        run: rm -rf zstandard_native

      - name: Clean and get dependencies (force pub cache)
        working-directory: zstandard_linux
        run: |
          flutter clean
          flutter pub get

      - name: Get dependencies in example (force pub cache)
        working-directory: zstandard_linux/example
        run: |
          flutter clean
          flutter pub get

      - name: Run integration tests (C sources from pub cache)
        working-directory: zstandard_linux/example
        run: flutter test integration_test/ -d linux

  check_linux_publish_dry_run:
    name: Dry Run Publish Linux
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Get dependencies
        working-directory: zstandard_linux
        run: flutter pub get

      - name: Publish Dry Run
        working-directory: zstandard_linux
        run: dart pub publish --dry-run
