name: PR Check Android

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.47.2' }}

jobs:
  check_android_analyze:
    name: Analyze Android
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Get dependencies
        working-directory: zstandard_android
        run: flutter pub get

      - name: Analyze check
        working-directory: zstandard_android
        run: flutter analyze

  check_android_test:
    name: Test Android
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Get dependencies
        working-directory: zstandard_android/example
        run: flutter pub get

      - name: Set up JDK 17 (required by android-emulator-runner / sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare isolated Android SDK directories
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/zstandard-android-$GITHUB_JOB"
          mkdir -p "$sdk_root" "$RUNNER_TEMP/zstandard-avd-$GITHUB_JOB" "$RUNNER_TEMP/zstandard-android-user-$GITHUB_JOB"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/zstandard-avd-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/zstandard-android-user-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Prepare Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          profile: pixel_4
          arch: arm64-v8a
          avd-name: zstandard_ci_test
          emulator-port: 5554
          script: |
            cd zstandard_android/example && flutter test integration_test/ -d emulator-${EMULATOR_PORT}

  check_android_test_from_pub_cache:
    name: Test Android (from pub cache)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Remove zstandard_native to force resolution from pub cache
        run: rm -rf zstandard_native

      - name: Clean and get dependencies (force pub cache)
        working-directory: zstandard_android
        run: |
          flutter clean
          flutter pub get

      - name: Get dependencies in example (force pub cache)
        working-directory: zstandard_android/example
        run: |
          flutter clean
          flutter pub get

      - name: Set up JDK 17 (required by android-emulator-runner / sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare isolated Android SDK directories
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/zstandard-android-$GITHUB_JOB"
          mkdir -p "$sdk_root" "$RUNNER_TEMP/zstandard-avd-$GITHUB_JOB" "$RUNNER_TEMP/zstandard-android-user-$GITHUB_JOB"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/zstandard-avd-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/zstandard-android-user-$GITHUB_JOB" >> "$GITHUB_ENV"

      - name: Prepare Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Run integration tests on emulator (from pub cache)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          profile: pixel_4
          arch: arm64-v8a
          avd-name: zstandard_ci_test_pubcache
          emulator-port: 5556
          script: |
            cd zstandard_android/example && flutter test integration_test/ -d emulator-${EMULATOR_PORT}

  check_android_publish_dry_run:
    name: Dry Run Publish Android
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache-path: '${{ runner.tool_cache }}/zstandard-flutter-v2/:channel:-:version:-:arch:'

      - name: Get dependencies
        working-directory: zstandard_android
        run: flutter pub get

      - name: Publish Dry Run
        working-directory: zstandard_android
        run: dart pub publish --dry-run
