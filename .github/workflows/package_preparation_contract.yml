name: Package preparation contract
on:
  pull_request:
    paths:
      - '.github/actions/prepare-package-release/**'
      - '.github/scripts/update_versions.dart'
      - '.github/scripts/tests/test_package_preparation.py'
      - '.github/scripts/tests/test_hotfix_ref.py'
      - 'scripts/check_pub_metadata.dart'
      - '.github/workflows/package_preparation_contract.yml'
      - '.github/workflows/release_workflow.yml'
      - '.github/workflows/hotfix_workflow.yml'
permissions:
  contents: read
jobs:
  package-preparation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: '3.47.2'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated YAML parser
        run: |
          python -m venv "$RUNNER_TEMP/preparation-contract"
          "$RUNNER_TEMP/preparation-contract/bin/python" -m pip install PyYAML==6.0.3
      - name: Verify real metadata preparation and failure behavior
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_package_preparation.py -v'
      - name: Reject preparation outside the matching hotfix branch
        run: '"$RUNNER_TEMP/preparation-contract/bin/python" -m unittest discover -s .github/scripts/tests -p test_hotfix_ref.py -v'
