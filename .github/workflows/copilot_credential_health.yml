name: Copilot - Credential Health

on:
  workflow_dispatch:
    inputs:
      check_pat:
        description: Check the workflow PAT against GitHub
        required: false
        default: false
        type: boolean
      check_openai:
        description: Check OPENAI_API_KEY
        required: false
        default: false
        type: boolean
      check_anthropic:
        description: Check ANTHROPIC_API_KEY
        required: false
        default: false
        type: boolean
      check_google:
        description: Check GOOGLE_API_KEY
        required: false
        default: false
        type: boolean
      check_openrouter:
        description: Check OPENROUTER_API_KEY
        required: false
        default: false
        type: boolean
      check_cursor:
        description: Check CURSOR_API_KEY
        required: false
        default: false
        type: boolean
      check_opencode:
        description: Check OPENCODE_API_KEY
        required: false
        default: false
        type: boolean
      check_codex_api_key:
        description: Check CODEX_API_KEY
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-pat:
    if: ${{ inputs.check_pat }}
    name: Verify PAT
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate PAT without exposing its value
        shell: bash
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${PAT:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$PAT" != *$'\r'* && "$PAT" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'Authorization: Bearer %s\n' "$PAT" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- --header 'Accept: application/vnd.github+json' https://api.github.com/user >/dev/null
          printf 'Authorization: Bearer %s\n' "$PAT" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- --header 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}" >/dev/null

  verify-openai:
    if: ${{ inputs.check_openai }}
    name: Verify OPENAI_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate OpenAI key without exposing its value
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$OPENAI_API_KEY" != *$'\r'* && "$OPENAI_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'Authorization: Bearer %s\n' "$OPENAI_API_KEY" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- https://api.openai.com/v1/models >/dev/null

  verify-anthropic:
    if: ${{ inputs.check_anthropic }}
    name: Verify ANTHROPIC_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Anthropic key without exposing its value
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$ANTHROPIC_API_KEY" != *$'\r'* && "$ANTHROPIC_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'x-api-key: %s\n' "$ANTHROPIC_API_KEY" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- --header 'anthropic-version: 2023-06-01' https://api.anthropic.com/v1/models >/dev/null

  verify-google:
    if: ${{ inputs.check_google }}
    name: Verify GOOGLE_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Google key without exposing its value
        shell: bash
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${GOOGLE_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$GOOGLE_API_KEY" != *$'\r'* && "$GOOGLE_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'x-goog-api-key: %s\n' "$GOOGLE_API_KEY" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- https://generativelanguage.googleapis.com/v1beta/models >/dev/null

  verify-openrouter:
    if: ${{ inputs.check_openrouter }}
    name: Verify OPENROUTER_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate OpenRouter key without exposing its value
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$OPENROUTER_API_KEY" != *$'\r'* && "$OPENROUTER_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'Authorization: Bearer %s\n' "$OPENROUTER_API_KEY" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- https://openrouter.ai/api/v1/models >/dev/null

  verify-cursor:
    if: ${{ inputs.check_cursor }}
    name: Verify CURSOR_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Cursor key without exposing its value
        shell: bash
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${CURSOR_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$CURSOR_API_KEY" != *$'\r'* && "$CURSOR_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          basic_auth="$(printf '%s:' "$CURSOR_API_KEY" | base64 | tr -d '\r\n')"
          printf 'Authorization: Basic %s\n' "$basic_auth" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- 'https://api.cursor.com/analytics/ai-code/changes?startDate=30d&page=1&pageSize=1' >/dev/null
          unset basic_auth

  verify-opencode:
    if: ${{ inputs.check_opencode }}
    name: Verify OPENCODE_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate OpenCode key without exposing its value
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${OPENCODE_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$OPENCODE_API_KEY" != *$'\r'* && "$OPENCODE_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'Authorization: Bearer %s\n' "$OPENCODE_API_KEY" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- https://opencode.ai/zen/v1/models >/dev/null

  verify-codex-api-key:
    if: ${{ inputs.check_codex_api_key }}
    name: Verify CODEX_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Codex API key without exposing its value
        shell: bash
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${CODEX_API_KEY:-}" ]] || { echo 'Required credential is missing.' >&2; exit 1; }
          [[ "$CODEX_API_KEY" != *$'\r'* && "$CODEX_API_KEY" != *$'\n'* ]] || { echo 'Credential contains invalid line breaks.' >&2; exit 1; }
          printf 'Authorization: Bearer %s\n' "$CODEX_API_KEY" | curl -q --fail --silent --show-error --location --max-redirs 0 --proto '=https' --proto-redir '=https' --max-time 20 --header @- https://api.openai.com/v1/models >/dev/null
