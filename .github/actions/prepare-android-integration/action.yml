name: Prepare isolated Android integration
description: Keep SDK, Flutter settings and bounded Gradle processes local to this job.
runs:
  using: composite
  steps:
    - name: Prepare private Android build state and select the job JDK
      shell: bash
      run: |
        set -euo pipefail
        build_directory="$(mktemp -d "$RUNNER_TEMP/zstandard-android-build.XXXXXX")"
        sdk_root="$build_directory/sdk"
        gradle_root="$build_directory/gradle"
        flutter_profile="$build_directory/flutter-profile"
        mkdir -p "$sdk_root" "$gradle_root" "$flutter_profile" "$build_directory/avd" "$build_directory/android-user"
        cat > "$gradle_root/gradle.properties" <<'PROPERTIES'
        org.gradle.daemon=false
        org.gradle.parallel=false
        org.gradle.workers.max=2
        org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        kotlin.compiler.execution.strategy=in-process
        PROPERTIES
        {
          echo "ANDROID_HOME=$sdk_root"
          echo "ANDROID_SDK_ROOT=$sdk_root"
          echo "ANDROID_AVD_HOME=$build_directory/avd"
          echo "ANDROID_USER_HOME=$build_directory/android-user"
          echo "ANDROID_EMULATOR_HOME=$build_directory/android-user"
          echo "GRADLE_USER_HOME=$gradle_root"
          echo "ZSTANDARD_FLUTTER_PROFILE=$flutter_profile"
        } >> "$GITHUB_ENV"
        # Flutter otherwise prefers the host Android Studio JBR over JAVA_HOME.
        # Configure a private child profile; never rewrite the operator's config.
        env HOME="$flutter_profile" XDG_CONFIG_HOME="$flutter_profile/config" \
          flutter config --jdk-dir="$JAVA_HOME"
